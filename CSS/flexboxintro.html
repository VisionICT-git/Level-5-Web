<!DOCTYPE html>
<html>
<head>
<style>
    *{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
.flex-container {
  display: flex;
  background-color: tomato;
}

.flex-container > .vision {
  background-color:purple;
  color: white;
 }
.flex-container > div {
  background-color: white;
  margin: 10px;
  padding: 20px;
  font-size: 30px;
}
</style>
</head>
<body>

<h1>Example of the flex-container</h1>

<div class="flex-container">
  <div>ATC</div>
  <div class="vision">Vision</div>
  <div>College is a great place to study</div>  
</div>

<p>You can assign separate styling for each of the flex items</p>
</body>
</html>
