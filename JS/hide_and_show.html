<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>The element control using Javascript</h1>
    <p id="demo">This is a paragraph and it wants to hide.</p>
    <button type="button" onclick="document.getElementById('demo').style.display = 'none'">Click me and see the magic</button>
    <p id="change" style="display: none;">Changed</p><br><br>
    <button type="button" onclick="document.getElementById('change').style.display = 'block'">Lets see what changes</button><br><br>
    <button type="button" onclick="document.getElementById('demo').innerHTML = 'Welcome to JS'">See the content</button>
</body>
</html>
