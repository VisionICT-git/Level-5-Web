<!DOCTYPE html>
<html>
<head>
<style>
    *{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
.flex-container {
  display: flex;
  flex-direction: row;
  background-color: tomato;
  text-align: center;
  font-size: 25;
}
.flex-container > .vision {
  background-color:purple;
  color: white;
 }
.flex-container > div {
  background-color: white;
  width: 100px;
  margin: 10px;
  padding: 20px;
  font-size: 30px;
}
@media (max-width: 800px) {
    .flex-container{
        flex-direction: column;
        background-color: lightskyblue;
    }
    .flex-container > .vision {
  background-color:navy;
  color: white;
 }
}
    
}
</style>
</head>
<body>
<h1> flex board responsive</h1>
<div class="flex-container">
  <div>ATC</div>
  <div class="vision">Vision</div>
  <div>College</div>   
  <div>ATC</div>
  <div class="vision">Vision</div>
  <div>College</div>   
</div>
</body>
</html>
