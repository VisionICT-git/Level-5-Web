<!DOCTYPE html>
<html>
<head>
<style>
    *{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
.flex-container {
  display: flex;
  background-color: tomato;
  flex-flow: row wrap;
}

.flex-container > .vision {
  background-color:purple;
  color: white;
 }
.flex-container > div {
  background-color: white;
  margin: 10px;
  padding: 20px;
  font-size: 30px;
}
</style>
</head>
<body>

<h1>Example of the flex-flow property</h1>

<div class="flex-container">
  <div>ATC</div>
  <div class="vision">Vision</div>
  <div>College</div>  
  <div>Hamilton</div>
  <div>Auckland</div>
  <div>Christchurch</div>
  <div>New Zealand</div>
</div>
</body>
</html>
