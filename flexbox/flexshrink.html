<!DOCTYPE html>
<html>
<head>
<style>
    *{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
.flex-container {
  display: flex;
  align-items: stretch;
  background-color: tomato;
}
.flex-container > .vision {
  background-color:purple;
  color: white;
 }
.flex-container > div {
  background-color: white;
  width: 100px;
  margin: 10px;
  padding: 20px;
  font-size: 30px;
}
</style>
</head>
<body>
<h1> flex-shrink property of flex items</h1>
<div class="flex-container">
  <div>ATC</div>
  <div class="vision" style="flex-shrink: 0;">ATC</div>
  <div>ATC</div>
  <div>ATC</div>
  <div class="vision">ATC</div>
  <div>ATC</div>
  <div>ATC</div>        
</div>
</body>
</html>
