<!DOCTYPE html>
<html>
<head>
<style>
    *{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
.flex-container {
  display: flex;
  justify-content: space-between; /* change the value to center or flex-start (default) or flex-end, space-around, space between */
  background-color: tomato;
}
.flex-container > .vision {
  background-color:purple;
  color: white;
 }
.flex-container > div {
  background-color: white;
  margin: 10px;
  padding: 20px;
  font-size: 30px;
}
</style>
</head>
<body>
<h1> Justify content property</h1>
<div class="flex-container">
  <div>ATC</div>
  <div class="vision">Vision</div>
  <div>College</div>  
</div>
</body>
</html>
